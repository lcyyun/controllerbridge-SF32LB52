CONFIG_RT_TIMER_THREAD_STACK_SIZE=2048
CONFIG_RT_MAIN_THREAD_STACK_SIZE=8192
CONFIG_FINSH_THREAD_STACK_SIZE=8192
CONFIG_BSP_USING_FULL_ASSERT=y
CONFIG_BLUETOOTH=y
CONFIG_RT_USING_BLUETOOTH=y
CONFIG_BT_FINSH=y
CONFIG_BT_PROFILE_CUSTOMIZE=y
CONFIG_CFG_BT_L2CAP_PROFILE=y
CONFIG_BSP_BT_CONNECTION_MANAGER=y
CONFIG_BT_CON_NUM_CUSTOMIZE=y
CONFIG_CFG_MAX_BT_ACL_NUM=2
CONFIG_CFG_MAX_BT_BOND_NUM=4
CONFIG_PKG_USING_FLASHDB=y
CONFIG_PKG_USING_CHERRYUSB=y
CONFIG_PKG_CHERRYUSB_DEVICE=y
# The SDK MUSB port has SF32 bidirectional-endpoint and exact-MPS EP0 bugs.
# usb/cherryusb_sifli carries the project-local fixed port.
CONFIG_PKG_CHERRYUSB_DEVICE_HID=y
CONFIG_PKG_CHERRYUSB_DEVICE_AUDIO=y
CONFIG_PKG_LIB_OPUS=y
CONFIG_PKG_USING_CHERRYUSB_LATEST_VERSION=y
